name: Privilege Escalation Pilot Checks

on:
  pull_request:
    paths:
      - 'policies/HMCTSNoPrivEscPilot*/policy.json'
      - 'pipeline-scripts/privilege-escalation-pilot*'
      - '.github/workflows/privilege-escalation-pilot.yml'
  push:
    branches: [master]
    paths:
      - 'policies/HMCTSNoPrivEscPilot*/policy.json'
      - 'pipeline-scripts/privilege-escalation-pilot*'
      - '.github/workflows/privilege-escalation-pilot.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Check generated definitions and structural controls
        run: node pipeline-scripts/privilege-escalation-pilot.mjs --check
      - name: Run pinned Gatekeeper engine and known-risk characterization
        run: bash pipeline-scripts/privilege-escalation-pilot-engine.sh