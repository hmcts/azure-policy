name: Privilege Escalation Pilot Checks

on:
  pull_request:
    paths:
      - 'policies/HMCTSNoPrivEsc*/policy.json'
      - 'assignments/subscriptions/**/assign.*privilege-escalation*.json'
      - 'pipeline-scripts/privilege-escalation-pilot*'
      - 'pipeline-scripts/sandbox-override.sh'
      - '.github/workflows/manage-azure-policy.yml'
      - '.github/workflows/privilege-escalation-pilot.yml'
  push:
    branches: [master]
    paths:
      - 'policies/HMCTSNoPrivEsc*/policy.json'
      - 'assignments/subscriptions/**/assign.*privilege-escalation*.json'
      - 'pipeline-scripts/privilege-escalation-pilot*'
      - 'pipeline-scripts/sandbox-override.sh'
      - '.github/workflows/manage-azure-policy.yml'
      - '.github/workflows/privilege-escalation-pilot.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Check generated definitions, assignments and structural controls
        run: node pipeline-scripts/privilege-escalation-pilot.mjs --check
      - name: Check isolated fixtures and offline acceptance checkers
        run: node pipeline-scripts/privilege-escalation-pilot-fixtures.mjs --self-test
      - name: Install isolated pinned sandbox JSON tool
        run: npm install --prefix "$RUNNER_TEMP/dtspo35033-json" --no-audit --no-fund --ignore-scripts --package-lock=false json@11.0.0
      - name: Verify actual sandbox and normal deployment boundaries
        run: node pipeline-scripts/privilege-escalation-pilot-deployment.mjs
        env:
          DTSPO_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          DTSPO_JSON_MODULES: ${{ runner.temp }}/dtspo35033-json/node_modules
      - name: Require safe targeting in the pinned Gatekeeper engine
        run: bash pipeline-scripts/privilege-escalation-pilot-engine.sh